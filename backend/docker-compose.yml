name: feiras-app

services:
  users-service:
    build:
      context: ./users-service
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      HOST: 0.0.0.0
      MONGO_URL: ${MONGO_URL_USERS}
      JWT_SECRET: ${JWT_SECRET}
    expose:
      - "3000"
    networks:
      - feiras-net

  markets-service:
    build:
      context: ./markets-service
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GRAPHQL_PORT: 3001
      BIND_HOST: 0.0.0.0
      MONGO_URL: ${MONGO_URL_MARKETS}
      JWT_SECRET: ${JWT_SECRET}
      USERS_SERVICE_URL: http://users-service:3000
      RATINGS_SERVICE_URL: http://ratings-service:3004
    expose:
      - "3001"
    networks:
      - feiras-net

  ratings-service:
    build:
      context: ./ratings-service
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3004
      HOST: 0.0.0.0
      MONGO_URL: ${MONGO_URL_RATINGS}
      JWT_SECRET: ${JWT_SECRET}
      MARKETS_SERVICE_URL: http://markets-service:3001
    expose:
      - "3004"
    networks:
      - feiras-net

  favorites-service:
    build:
      context: ./favorites-service
    restart: unless-stopped
    environment:
      SPRING_DATA_MONGODB_URI: ${MONGO_URL_FAVORITES}
      SERVER_PORT: 3003
    expose:
      - "3003"
    networks:
      - feiras-net

  notifications-service:
    build:
      context: ./notifications-service
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3002
      HOST: 0.0.0.0
      MONGO_URL: ${MONGO_URL_NOTIFICATIONS}
      JWT_SECRET: ${JWT_SECRET}
      USERS_SERVICE_URL: http://users-service:3000
    expose:
      - "3002"
    depends_on:
      - users-service
    networks:
      - feiras-net

  notes-service:
    build:
      context: ./notes-service
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3005
      HOST: 0.0.0.0
      MONGO_URL: ${MONGO_URL_NOTES}
      JWT_SECRET: ${JWT_SECRET}
    expose:
      - "3005"
    networks:
      - feiras-net

  routing-service:
    build:
      context: ./routing-service
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3006
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET}
      OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY}
      MOTIS_BASE_URL: ${MOTIS_BASE_URL}
    expose:
      - "3006"
    networks:
      - feiras-net

  otp-build:
    image: feiras-otp:2.10.0
    build:
      context: ./otp
      args:
        OTP_VERSION: "2.10.0"
    profiles:
      - otp-build
    command: ["--build", "--save", "."]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx8G"
    volumes:
      - ./otp/graph:/var/opentripplanner
    networks:
      - feiras-net

  otp:
    image: feiras-otp:2.10.0
    build:
      context: ./otp
      args:
        OTP_VERSION: "2.10.0"
    profiles:
      - otp
    command: ["--load", "--serve", "."]
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx8G"
    ports:
      - "127.0.0.1:${OTP_PORT:-8081}:8080"
    volumes:
      - ./otp/graph:/var/opentripplanner
    networks:
      - feiras-net

  api-gateway:
    build:
      context: ./api-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    depends_on:
      - users-service
      - markets-service
      - ratings-service
      - favorites-service
      - notifications-service
      - notes-service
      - routing-service
    networks:
      - feiras-net

networks:
  feiras-net:
    driver: bridge
