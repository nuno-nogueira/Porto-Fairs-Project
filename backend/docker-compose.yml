name: feiras-app

services:
  motis:
    image: ghcr.io/motis-project/motis:2.11.3
    restart: unless-stopped
    volumes:
      - motis-data:/data
    ports:
      - "127.0.0.1:8090:8090"
    expose:
      - "8090"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8090/api/v1/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - feiras-net

  motis-import:
    image: ghcr.io/motis-project/motis:2.11.3
    profiles:
      - motis-import
    working_dir: /input
    entrypoint: ["/motis"]
    command:
      - import
      - --data
      - /data
      - --config
      - /input/config.yml
    volumes:
      - ./motis:/input:ro
      - motis-data:/data
    networks:
      - feiras-net

  users-service:
    build:
      context: ./users-service
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      HOST: 0.0.0.0
      MONGO_URL: ${MONGO_URL_USERS}
      JWT_SECRET: ${JWT_SECRET}
    expose:
      - "3000"
    networks:
      - feiras-net

  markets-service:
    build:
      context: ./markets-service
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GRAPHQL_PORT: 3001
      BIND_HOST: 0.0.0.0
      MONGO_URL: ${MONGO_URL_MARKETS}
      JWT_SECRET: ${JWT_SECRET}
      USERS_SERVICE_URL: http://users-service:3000
      RATINGS_SERVICE_URL: http://ratings-service:3004
    expose:
      - "3001"
    networks:
      - feiras-net

  ratings-service:
    build:
      context: ./ratings-service
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3004
      HOST: 0.0.0.0
      MONGO_URL: ${MONGO_URL_RATINGS}
      JWT_SECRET: ${JWT_SECRET}
      MARKETS_SERVICE_URL: http://markets-service:3001
    expose:
      - "3004"
    networks:
      - feiras-net

  favorites-service:
    build:
      context: ./favorites-service
    restart: unless-stopped
    environment:
      SPRING_DATA_MONGODB_URI: ${MONGO_URL_FAVORITES}
      SERVER_PORT: 3003
    expose:
      - "3003"
    networks:
      - feiras-net

  notifications-service:
    build:
      context: ./notifications-service
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3002
      HOST: 0.0.0.0
      MONGO_URL: ${MONGO_URL_NOTIFICATIONS}
      JWT_SECRET: ${JWT_SECRET}
      USERS_SERVICE_URL: http://users-service:3000
    expose:
      - "3002"
    depends_on:
      - users-service
    networks:
      - feiras-net

  notes-service:
    build:
      context: ./notes-service
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3005
      HOST: 0.0.0.0
      MONGO_URL: ${MONGO_URL_NOTES}
      JWT_SECRET: ${JWT_SECRET}
    expose:
      - "3005"
    networks:
      - feiras-net

  routing-service:
    build:
      context: ./routing-service
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3006
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET}
      OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY}
      MOTIS_BASE_URL: http://motis:8090
    expose:
      - "3006"
    networks:
      - feiras-net  
    depends_on:
      motis:
        condition: service_healthy

  api-gateway:
    build:
      context: ./api-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    depends_on:
      - users-service
      - markets-service
      - ratings-service
      - favorites-service
      - notifications-service
      - notes-service
      - routing-service
    networks:
      - feiras-net

volumes:
  motis-data:

networks:
  feiras-net:
    driver: bridge
