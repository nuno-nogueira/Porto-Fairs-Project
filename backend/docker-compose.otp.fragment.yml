
services:
  # One-shot graph builder.
  otp-build:
    image: feiras-otp:2.10.0
    build:
      context: ./otp
      args:
        OTP_VERSION: "2.10.0"
    profiles:
      - otp-build
    command: ["--build", "--save"]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx8G"
    volumes:
      - ./otp/graph:/var/opentripplanner
    networks:
      - feiras-net

  # Long-running OTP routing server.
  otp:
    image: feiras-otp:2.10.0
    build:
      context: ./otp
      args:
        OTP_VERSION: "2.10.0"
    profiles:
      - otp
    command: ["--load", "--serve"]
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx8G"
    ports:
      - "127.0.0.1:${OTP_PORT:-8081}:8080"
    volumes:
      - ./otp/graph:/var/opentripplanner
    networks:
      - feiras-net
