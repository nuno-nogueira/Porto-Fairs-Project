events {
    worker_connections 1024; 
}

http {
    upstream users_servers {
        server users-service:3000;
    }

    upstream favorites_servers {
        server favorites-service:3003;
    }

    upstream notifications_servers {
        server notifications-service:3002;
    }

    upstream markets_servers {
        server markets-service:3001;
    }

    upstream ratings_servers {
        server ratings-service:3004;
    }

    upstream notes_servers {
        server notes-service:3005;
    }

    server {
        listen 80;
        
        proxy_set_header Host $host;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        # Users: /api/users/login -> /login
        location = /api/users {
            proxy_pass http://users_servers/;
        }

        location ^~ /api/users/ {
            proxy_pass http://users_servers/;
        }

        # Favorites: /api/favorites/ -> /favorites/
        location = /api/favorites {
            proxy_pass http://favorites_servers/favorites;
        }

        location ^~ /api/favorites/ {
            proxy_pass http://favorites_servers/favorites/;
        }

        # Notifications: /api/notifications/ -> /notifications/
        location = /api/notifications {
            proxy_pass http://notifications_servers/notifications/;
        }

        location ^~ /api/notifications/ {
            proxy_pass http://notifications_servers/notifications/;
        }

        # Markets GraphQL: /api/markets/ -> /
        location = /api/markets {
            proxy_pass http://markets_servers/;
        }

        location ^~ /api/markets/ {
            proxy_pass http://markets_servers/;
        }

        # Ratings: /api/ratings/ -> /ratings/
        location = /api/ratings {
            proxy_pass http://ratings_servers/ratings/;
        }

        location ^~ /api/ratings/ {
            proxy_pass http://ratings_servers/ratings/;
        }

        # Notes: /api/notes/ -> /notes/
        location = /api/notes {
            proxy_pass http://notes_servers/notes/;
        }

        location ^~ /api/notes/ {
            proxy_pass http://notes_servers/notes/;
        }
    }
}